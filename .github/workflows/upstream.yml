---
name: Upstream intake
"on":
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: upstream-intake
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted default-branch tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.upstream.intake
