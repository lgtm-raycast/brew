---
enforce:
  line_length: 120
execution:
  # An empty allowlist considers every lintro tool; inapplicable tools self-skip.
  enabled_tools: []
  exclude:
    - ".lintro/"
    - ".venv/"
    - "node_modules/"
    - "dist/"
    - "coverage/"
    - "raycast-env.d.ts"
  fail_fast: false
defaults:
  markdownlint:
    MD013:
      line_length: 120
      code_blocks: false
      tables: false
  yamllint:
    extends: default
    rules:
      truthy:
        check-keys: true
      line-length:
        max: 120
        allow-non-breakable-inline-mappings: true
      comments:
        min-spaces-from-content: 1
# Local linting stays deterministic; the review workflow explicitly enables AI.
ai:
  enabled: false
  provider: anthropic
  transport: cli
  providers:
    anthropic:
      cli_bare: never
